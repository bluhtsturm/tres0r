name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux · Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen  # GUI-Tests ohne Bildschirm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Systempakete (FUSE, Qt ohne Bildschirm, groff/zsh für Doku-Tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfuse2t64 fuse3 groff-base zsh \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Installieren (alle Extras)
        run: python -m pip install -e ".[dev,zstd,tui,gui,fido2,mount]" pyflakes
      - name: Statische Prüfung
        run: git ls-files -z '*.py' | grep -zv '^tres0r/pwgen.py$' | xargs -0 python -m pyflakes
      - name: Tests (1 Kern)
        run: python -m pytest -q
      - name: Tests (4 simulierte Kerne – Hintergrund-Dekodierer, Hash- und zstd-Worker)
        run: python -m pytest -q
        env:
          TRES0R_TEST_CPUS: "4"
      - name: CLI-Rauchtest
        run: |
          tres0r --version
          tres0r genpass -c 2
          tres0r bench --kdf-time 0.5

  minimal:
    name: Minimalinstallation (nur cryptography)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q

  package:
    name: Paket bauen und aus dem Quellpaket testen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine pytest hypothesis zstandard
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Tests aus dem entpackten Quellpaket
        run: |
          mkdir sdist && tar xzf dist/*.tar.gz -C sdist --strip-components=1
          cd sdist && python -m pip install . && python -m pytest -q
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  portability:
    name: Erprobung · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true  # nie auf diesen Systemen getestet – Befunde ansehen, CI nicht rot färben
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,zstd,tui,fido2]"
      - run: python -m pytest -q
